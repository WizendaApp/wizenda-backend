services:
  app:
    build:
      dockerfile: Dockerfile
      context: .
    networks:
      - mongo_network
      - redis_network
    container_name: wizenda-backend
    env_file:
      - .env.example
    depends_on:
      - mongo
  mongo:
    image: 'mongo:latest'
    environment:
      - 'MONGO_INITDB_DATABASE=wiza'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
    networks:
      - mongo_network
  redis:
    image: redis:latest
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"  # Expose mongo-express on localhost:8081
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo  # MongoDB service name
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=secret
    depends_on:
      - mongo
    networks:
      - mongo_network

networks:
  mongo_network:
    driver: bridge
  redis_network:
    driver: bridge